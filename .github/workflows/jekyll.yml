name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The product sites show these news (news.json, fetched when they build): once this site is
  # deployed, rebuild them if the news changed. Needs the PRODUCT_SITES_TOKEN secret, a token
  # allowed to run the Actions of the three product repositories (docs/news.md in the theme);
  # without it they pick the news up on their daily rebuild.
  rebuild-product-sites:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild the product sites when the news changed
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_SITES_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PRODUCT_SITES_TOKEN is not set: the product sites get the news on their daily rebuild"
            exit 0
          fi
          # On a push, rebuild only when the news changed; when the previous commit is unknown
          # (first push, force-push), rebuild anyway
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" \
                 | grep -qE '^(_news/|_data/topics\.yml|_plugins/news\.rb|news\.json)'; then
              echo "No news changed"
              exit 0
            fi
          fi
          for site in musadsl-website musalce-website nota-website; do
            gh workflow run jekyll.yml --repo "javier-sy/$site" --ref main
          done
